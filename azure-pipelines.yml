name: $(SourceBranchName)_$(date:yyyyMMdd)$(rev:.r)_PerilsProximity_Build_Configs

#Pipeline actions:
# select environment eg staging, fint, pre-prod, prod
# PnP config files are copied to the machine(s) for the target environment
# SSH service connections must exist for each of the environments in a variable group for that environment
# Variable group name PerilsProximity.Configs.TARGET_ENVIRONMENT e.g  PerilsProximity.Configs.Staging
# Once the files are copied, the next step requires manual approval
# Check that the files copied currently to $(working_directory)\ variable eg. C:\PnPConfigsDeployment\ are as expected
# After manual approval, the copied files are deployed into relevant folders eg wwwroot, PnP services etc

#TODO:
# stop and start services
# smoke testing?


trigger:
  - config-pipeline
  - master

appendCommitMessageToRunName: false

pool:
  vmImage: windows-latest

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: staging
    values:
    - staging
    - fint
    - preprod
    - production
  - name: BuildArtifacts
    displayName: Build and Copy PnP configs and ArcGIS Server artifacts
    type: boolean
    default: true
  - name: DeployPnPConfigs
    displayName: Deploy PnP Configs
    type: boolean
    default: true
  - name: DeployDomain
    displayName: Deploy domains
    type: boolean
    default: true
  - name: ImportUKFloodRasters
    displayName: Import UK flood rasters
    type: boolean
    default: false
  - name: UpdateGDBVectorDatasets
    displayName: Update geodatabase vector datasets
    type: boolean
    default: false
  - name: UpdateMapDataSources
    displayName: Update geodatabase vector datasets
    type: boolean
    default: false
  - name: PublishArcGISServerServices
    displayName: Publish ArcGIS Server Services
    type: boolean
    default: false

variables:
- group: PerilsProximity.Configs.${{ parameters.environment }} # note there's a dash at the beginning of the line
- name: time
  value: $[ format('{0:yyyy}-{0:MM}-{0:dd}-{0:HHmm}', pipeline.startTime) ]
- name: build_artifact_name
  value: Build-drop-${{ parameters.environment }}

stages:
  - stage: BuildArtifacts
    condition: and(succeeded(), ${{ eq(parameters.BuildArtifacts,true) }})  
    jobs:
    - job: CopyFilesToEnvironment
      displayName: ${{ parameters.environment }} copy configs
      steps:
        - task: CopyFiles@2
          displayName: 'Copy ${{ parameters.environment }} config  files to: $(Build.ArtifactStagingDirectory)'
          inputs:
            contents: |
              ${{ parameters.environment }}/config/batch.config
              ${{ parameters.environment }}/config/BatchProcessorService.exe.config
              ${{ parameters.environment }}/config/BatchProcessor_Log.config
              ${{ parameters.environment }}/config/BatchSubmissionService.exe.config
              ${{ parameters.environment }}/config/BatchSubmission_log.config
              ${{ parameters.environment }}/config/BatchWebTestHarness.exe.config
              ${{ parameters.environment }}/config/Create_Message.exe.config
              ${{ parameters.environment }}/config/MQListener.exe.config
              ${{ parameters.environment }}/config/TEst_App.exe.config
              ${{ parameters.environment }}/config/BatchManager/Web.config
              ${{ parameters.environment }}/config/BatchStatus/Web.config
              ${{ parameters.environment }}/config/BestAddress/Web.config
              ${{ parameters.environment }}/config/Geoassessment/Web.config
              ${{ parameters.environment }}/config/GlobalExposure/Web.config
              ${{ parameters.environment }}/config/LocatorHubWS/Web.config
              ${{ parameters.environment }}/config/PerilsPlusWS/Web.config
              utilities/deploy_config.ps1
              utilities/execute_python_module.ps1
              arcgis_services/**
            targetFolder: $(Build.ArtifactStagingDirectory)
        - task: PowerShell@2
          displayName: 'Detect available XML transforms'
          inputs:
            targetType: 'inline'
            script: |
              $envName = "${{ parameters.environment }}"
              $src = "$(Build.SourcesDirectory)"
              $best = Join-Path $src "transforms/BestAddress/Web.$envName.config"
              $batchMgr = Join-Path $src "transforms/BatchManager/Web.$envName.config"
              $batchStatus = Join-Path $src "transforms/BatchStatus/Web.$envName.config"
              $geo = Join-Path $src "transforms/Geoassessment/Web.$envName.config"
              $globExp = Join-Path $src "transforms/GlobalExposure/Web.$envName.config"
              $loc = Join-Path $src "transforms/LocatorHubWS/Web.$envName.config"
              $pp = Join-Path $src "transforms/PerilsPlusWS/Web.$envName.config"

              function SetVarIfExists($path, $var) {
                if (Test-Path -LiteralPath $path) {
                  Write-Host "Found transform: $path"
                  Write-Host "##vso[task.setvariable variable=$var]true"
                } else {
                  Write-Host "No transform found: $path"
                  Write-Host "##vso[task.setvariable variable=$var]false"
                }
              }

              SetVarIfExists $best "hasTransform_BestAddress"
              SetVarIfExists $batchMgr "hasTransform_BatchManager"
              SetVarIfExists $batchStatus "hasTransform_BatchStatus"
              SetVarIfExists $geo "hasTransform_Geoassessment"
              SetVarIfExists $globExp "hasTransform_GlobalExposure"
              SetVarIfExists $loc "hasTransform_LocatorHubWS"
              SetVarIfExists $pp "hasTransform_PerilsPlusWS"

        - task: FileTransform@2
          displayName: 'Apply transform: BestAddress'
          condition: and(succeeded(), eq(variables.hasTransform_BestAddress, 'true'))
          inputs:
            folderPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config/BestAddress'
            fileType: 'xml'
            targetFiles: '**/Web.config'
            transformFile: '$(Build.SourcesDirectory)/transforms/BestAddress/Web.${{ parameters.environment }}.config'

        - task: FileTransform@2
          displayName: 'Apply transform: BatchManager'
          condition: and(succeeded(), eq(variables.hasTransform_BatchManager, 'true'))
          inputs:
            folderPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config/BatchManager'
            fileType: 'xml'
            targetFiles: '**/Web.config'
            transformFile: '$(Build.SourcesDirectory)/transforms/BatchManager/Web.${{ parameters.environment }}.config'

        - task: FileTransform@2
          displayName: 'Apply transform: BatchStatus'
          condition: and(succeeded(), eq(variables.hasTransform_BatchStatus, 'true'))
          inputs:
            folderPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config/BatchStatus'
            fileType: 'xml'
            targetFiles: '**/Web.config'
            transformFile: '$(Build.SourcesDirectory)/transforms/BatchStatus/Web.${{ parameters.environment }}.config'

        - task: FileTransform@2
          displayName: 'Apply transform: Geoassessment'
          condition: and(succeeded(), eq(variables.hasTransform_Geoassessment, 'true'))
          inputs:
            folderPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config/Geoassessment'
            fileType: 'xml'
            targetFiles: '**/Web.config'
            transformFile: '$(Build.SourcesDirectory)/transforms/Geoassessment/Web.${{ parameters.environment }}.config'

        - task: FileTransform@2
          displayName: 'Apply transform: GlobalExposure'
          condition: and(succeeded(), eq(variables.hasTransform_GlobalExposure, 'true'))
          inputs:
            folderPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config/GlobalExposure'
            fileType: 'xml'
            targetFiles: '**/Web.config'
            transformFile: '$(Build.SourcesDirectory)/transforms/GlobalExposure/Web.${{ parameters.environment }}.config'

        - task: FileTransform@2
          displayName: 'Apply transform: LocatorHubWS'
          condition: and(succeeded(), eq(variables.hasTransform_LocatorHubWS, 'true'))
          inputs:
            folderPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config/LocatorHubWS'
            fileType: 'xml'
            targetFiles: '**/Web.config'
            transformFile: '$(Build.SourcesDirectory)/transforms/LocatorHubWS/Web.${{ parameters.environment }}.config'

        - task: FileTransform@2
          displayName: 'Apply transform: PerilsPlusWS'
          condition: and(succeeded(), eq(variables.hasTransform_PerilsPlusWS, 'true'))
          inputs:
            folderPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config/PerilsPlusWS'
            fileType: 'xml'
            targetFiles: '**/Web.config'
            transformFile: '$(Build.SourcesDirectory)/transforms/PerilsPlusWS/Web.${{ parameters.environment }}.config'

        # Token replacement for all config files
        - task: PowerShell@2
          displayName: 'Replace tokens in configuration files'
          inputs:
            targetType: 'inline'
            script: |
              $configPath = "$(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/config"
              
              Write-Host "Replacing tokens in configuration files at: $configPath"
              
              # Get all config files
              $configFiles = Get-ChildItem -Path $configPath -Recurse -Include "*.config", "*.xml", "*.ini" -File
              
              foreach ($file in $configFiles) {
                Write-Host "Processing file: $($file.FullName)"
                
                # Read file content
                $content = Get-Content $file.FullName -Raw
                
                # Replace tokens with pipeline variables
                # Connection string tokens
                $content = $content -replace '#\{DB_SERVER\}#', '$(DB_SERVER)'
                $content = $content -replace '#\{DB_NAME\}#', '$(DB_NAME)'
                $content = $content -replace '#\{DB_USER\}#', '$(DB_USER)'
                $content = $content -replace '#\{DB_PASSWORD\}#', '$(DB_PASSWORD)'
                
                # API endpoint tokens
                $content = $content -replace '#\{API_ENDPOINT\}#', '$(API_ENDPOINT)'
                $content = $content -replace '#\{ENVIRONMENT\}#', '$(Environment)'
                
                # Service connection tokens
                $content = $content -replace '#\{SERVICE_CONNECTION\}#', '$(server_service_connections)'
                
                # Write back to file
                Set-Content -Path $file.FullName -Value $content -NoNewline
                
                Write-Host "Completed token replacement for: $($file.Name)"
              }
              
              Write-Host "Token replacement completed for all configuration files"

        - task: PowerShell@2
          displayName: 'Move deploy_config script'
          inputs:
            targetType: 'inline'
            script: |
              Move-Item -Path $(Build.ArtifactStagingDirectory)/utilities/deploy_config.ps1 -Destination $(Build.ArtifactStagingDirectory)/${{ parameters.environment }}/deploy_config.ps1
        - task: CmdLine@2
          displayName: Display tree of build artifact from $(Build.ArtifactStagingDirectory) 
          inputs:
            script: |
              echo ##[debug]List of built in variables in Build.ArtifactStagingDirectory 
              tree $(Build.ArtifactStagingDirectory) /F
        - task: PublishBuildArtifacts@1
          displayName: 'Publish artifact'
          inputs:
            pathToPublish: $(Build.ArtifactStagingDirectory)
            artifactName: $(build_artifact_name)

        # Download build artifacts v1
        # Download files that were saved as artifacts of a completed build.
        - task: DownloadBuildArtifacts@1
          displayName: 'Download build artifact'
          inputs:
            buildType: 'current' # 'current' | 'specific'. Required. Download artifacts produced by. Default: current.
            buildVersionToDownload: 'latest' # 'latest' | 'latestFromBranch' | 'specific'. Required when buildType == specific. Build version to download. Default: latest.
            downloadType: 'single' # 'single' | 'specific'. Required. Download type. Default: single.
            artifactName: $(build_artifact_name) # string. Required when downloadType == single. Artifact name. 
            downloadPath: $(System.ArtifactsDirectory) # string. Required. Destination directory. Default: $(System.ArtifactsDirectory).
            cleanDestinationFolder: true # boolean. Clean destination folder. Default: false.
            checkDownloadedFiles: true # boolean. Check downloaded files. Default: false.
        - task: CmdLine@2
          displayName: Display tree of sytem artifact dir from $(System.ArtifactsDirectory)
          inputs:
            script: |
                echo ##[debug]List of built in variables in System.ArtifactsDirectory 
                tree $(System.ArtifactsDirectory) /F
        - task: PowerShell@2
          displayName: 'Copying files to $(server_service_connections)'
          inputs:
            targetType: 'inline'
            script: |
              $serverConns = "$(server_service_connections)"

              ForEach ($server in $serverConns.split(",")) {

                $soptions = New-PSSessionOption -SkipCACheck -SkipCNCheck
                $secpasswd = ConvertTo-SecureString "$(pnp_service_account_password)" -AsPlainText -Force
                $cred = New-Object System.Management.Automation.PSCredential ("$(pnp_service_account_name)", $secpasswd) 
                $computername = "$server"
                $computerport = 5986
                $sourceDirectory="$(System.ArtifactsDirectory)"
                $destinationFolder="$(working_directory)"

                Write-Host "Copying files source directory:  $sourceDirectory, destination directory:  $destinationFolder"

                $session = New-PSSession -ComputerName $computername -Port $computerport -Credential $cred -UseSSL -SessionOption $soptions

                Copy-Item $sourceDirectory\* -Destination $destinationFolder -ToSession $session  -Recurse  -Force
              }

    - job: ApproveDeployment
      displayName: ${{ parameters.environment }} wait for manual approval 
      dependsOn: CopyFilesToEnvironment
      timeoutInMinutes: 4320 # job times out in 3 days
      pool: server 
      steps:   
      - task: ManualValidation@1
        timeoutInMinutes: 4320 # task times out in 3 days
        inputs:
          notifyUsers: |
            itai.dhliwayo@uk.rsagroup.com
          instructions: 'Please validate the build drop in ${{ parameters.environment }} and resume deployment'
          allowApproversToApproveTheirOwnRuns: true
          onTimeout: 'reject'

  - stage: DeployPnPConfigs
    condition: and(succeeded('BuildArtifacts'), ${{ eq(parameters.BuildArtifacts,true) }})  
    jobs:
    - job: Deploy
      displayName:  ${{ parameters.environment }}  PnP config deploy 
      steps:
        - task: PowerShellOnTargetMachines@3
          displayName: 'Deploying to  targets using WinRm '
          inputs:
            Machines: $(server_service_connections)
            UserName: $(pnp_service_account_name)
            UserPassword: $(pnp_service_account_password)
            # Script options
            ScriptType: 'FilePath' # 'FilePath' | 'Inline'. Script Type. Default: Inline.
            ScriptPath: $(working_directory)\$(build_artifact_name)\${{ parameters.environment }}\deploy_config.ps1
            # PSSession options
            CommunicationProtocol: 'Https' # 'Http' | 'Https'. Protocol. Default: Https.
            AuthenticationMechanism: 'Default' # 'Default' | 'Credssp'. Authentication. Default: Default.
            NewPsSessionOptionArguments: '-SkipCACheck -IdleTimeout 7200000 -OperationTimeout 0 -OutputBufferingMode Block' # string. Session Option parameters. Default: -SkipCACheck -IdleTimeout 7200000 -OperationTimeout 0 -OutputBufferingMode Block.
            # Error handling options
            #ErrorActionPreference: 'stop' # 'stop' | 'continue' | 'silentlyContinue'. ErrorActionPreference. Default: stop.
            #failOnStderr: false # boolean. Fail on Standard Error. Default: false.
            #ignoreLASTEXITCODE: false # boolean. Ignore $LASTEXITCODE. Default: false.
            # Advanced
            #WorkingDirectory: # string. Working Directory. 
            #RunPowershellInParallel: true # boolean. Run PowerShell in Parallel. Default: true.

 
  - stage: DeployDomain
    condition: and(succeeded('BuildArtifacts'), ${{ eq(parameters.DeployDomain,true) }})   
    jobs:
    - job: DeployDomain
      displayName: Deploying to domains to  ${{ parameters.environment }}, hosts- $(server_service_connections)
      steps:
        - task: PowerShellOnTargetMachines@3
          displayName: 'Deploying to domains using WinRm '
          inputs:
            Machines: $(server_service_connections)
            UserName: $(pnp_service_account_name)
            UserPassword: $(pnp_service_account_password)
            ScriptType: 'FilePath' # 'FilePath' | 'Inline'. Script Type. Default: Inline.
            ScriptPath: $(working_directory)\$(build_artifact_name)\utilities\execute_python_module.ps1
            ScriptArguments: '-ModulePath "domains_add.add_domains" -WorkingDirectory "$(working_directory)\$(build_artifact_name)\arcgis_services\deploy\scripts\4_deploy_domains"'
            CommunicationProtocol: 'Https' # 'Http' | 'Https'. Protocol. Default: Https.
            AuthenticationMechanism: 'Default' # 'Default' | 'Credssp'. Authentication. Default: Default.
            NewPsSessionOptionArguments: '-SkipCACheck -IdleTimeout 7200000 -OperationTimeout 0 -OutputBufferingMode Block' # string. Session Option parameters. Default: -SkipCACheck -IdleTimeout 7200000 -OperationTimeout 0 -OutputBufferingMode Block.
    

      

