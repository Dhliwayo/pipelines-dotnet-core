name: SQL-Deployment-$(Build.BuildId)

# Simple SQL deployment pipeline following KISS principles
# Backup → Deploy → Verify

trigger:
  - main
  - develop

pr:
  - main
  - develop

pool:
  vmImage: 'windows-latest'

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'staging'
    values:
      - staging
      - production
  - name: skipBackup
    displayName: 'Skip Database Backup'
    type: boolean
    default: false

variables:
  - group: SQL-Deployment-$(parameters.environment)
  - name: scriptsFolder
    value: 'sql-scripts'

stages:
  - stage: Backup
    displayName: 'Backup Database (Optional)'
    condition: ne('${{ parameters.skipBackup }}', true)
    jobs:
      - deployment: BackupDatabase
        displayName: 'Create Database Backup'
        environment: '$(parameters.environment)'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShellOnTargetMachines@3
                  displayName: 'Backup Database'
                  inputs:
                    Machines: '$(targetMachine)'
                    UserName: '$(winrmUsername)'
                    UserPassword: '$(winrmPassword)'
                    ScriptType: 'Inline'
                    InlineScript: |
                      Import-Module SqlServer -Force
                      $ErrorActionPreference = 'Stop'
                      $backupFile = "$(backupLocation)/$(databaseName)_$(Get-Date -Format 'yyyyMMdd_HHmmss').bak"
                      $backupQuery = "BACKUP DATABASE [$(databaseName)] TO DISK = '$backupFile' WITH FORMAT, INIT"
                      Invoke-Sqlcmd -ServerInstance "$(sqlServer)" -Database "master" -Username "$(sqlUsername)" -Password "$(sqlPassword)" -Query $backupQuery -ErrorAction Stop -AbortOnError
                      Write-Host "Backup created: $backupFile"
                    CommunicationProtocol: 'Https'

  - stage: Deploy
    displayName: 'Deploy SQL Scripts'
    dependsOn: 
      - ${{ if ne(parameters.skipBackup, true) }}: Backup
      - ${{ if eq(parameters.skipBackup, true) }}: 
    jobs:
      - deployment: DeployToTarget
        displayName: 'Deploy to $(parameters.environment)'
        environment: '$(parameters.environment)'
        strategy:
          runOnce:
            deploy:
              steps:
                # Copy scripts to target via WinRM
                - task: PowerShell@2
                  displayName: 'Copy SQL scripts to target via WinRM'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $secpasswd = ConvertTo-SecureString "$(winrmPassword)" -AsPlainText -Force
                      $cred = New-Object System.Management.Automation.PSCredential ("$(winrmUsername)", $secpasswd)
                      $sessionOptions = New-PSSessionOption -SkipCACheck -SkipCNCheck
                      $session = New-PSSession -ComputerName "$(targetMachine)" -UseSSL -Port 5986 -Credential $cred -SessionOption $sessionOptions
                      try {
                        $destination = "C:\Deploy\sql-scripts"
                        Invoke-Command -Session $session -ScriptBlock { param($d) New-Item -ItemType Directory -Path $d -Force | Out-Null } -ArgumentList $destination
                        $source = "$(Build.SourcesDirectory)\sql-scripts"
                        Write-Host "Copying SQL scripts from '$source' to '$destination' on $(targetMachine)"
                        Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force -ToSession $session
                      } finally {
                        if ($session) { Remove-PSSession $session }
                      }
                # Deploy scripts
                - task: PowerShellOnTargetMachines@3
                  displayName: 'Deploy SQL Scripts'
                  inputs:
                    Machines: '$(targetMachine)'
                    UserName: '$(winrmUsername)'
                    UserPassword: '$(winrmPassword)'
                    ScriptType: 'Inline'
                    InlineScript: |
                      Import-Module SqlServer -Force
                      $ErrorActionPreference = 'Stop'
                      Set-StrictMode -Version Latest

                      $scripts = Get-ChildItem -Path "C:\Deploy\sql-scripts" -Filter "*.sql" -Recurse | Sort-Object Name

                      if (-not $scripts -or $scripts.Count -eq 0) {
                          Write-Error "No SQL scripts found in C:\Deploy\sql-scripts"
                          throw "No scripts to execute"
                      }

                      foreach ($script in $scripts) {
                          Write-Host "Executing: $($script.Name)"
                          try {
                              Invoke-Sqlcmd -ServerInstance "$(sqlServer)" -Database "$(databaseName)" -Username "$(sqlUsername)" -Password "$(sqlPassword)" -InputFile $script.FullName -AbortOnError -ErrorAction Stop
                              Write-Host "Completed: $($script.Name)"
                          }
                          catch {
                              Write-Error "Failed: $($script.Name) - $($_.Exception.Message)"
                              throw
                          }
                      }
                      Write-Host "All scripts deployed successfully"
                    CommunicationProtocol: 'Https'

                # Simple verification
                - task: PowerShellOnTargetMachines@3
                  displayName: 'Verify Deployment'
                  inputs:
                    Machines: '$(targetMachine)'
                    UserName: '$(winrmUsername)'
                    UserPassword: '$(winrmPassword)'
                    ScriptType: 'Inline'
                    InlineScript: |
                      Import-Module SqlServer -Force
                      $ErrorActionPreference = 'Stop'
                      $testQuery = "SELECT GETDATE() as CurrentTime, DB_NAME() as DatabaseName"
                      $result = Invoke-Sqlcmd -ServerInstance "$(sqlServer)" -Database "$(databaseName)" -Username "$(sqlUsername)" -Password "$(sqlPassword)" -Query $testQuery -ErrorAction Stop -AbortOnError
                      if (-not $result) { throw "Verification query returned no results" }
                      Write-Host "Deployment verified successfully: $($result.CurrentTime) on $($result.DatabaseName)"
                    CommunicationProtocol: 'Https'

  - stage: Report
    displayName: 'Generate Report'
    dependsOn: Deploy
    condition: always()
    jobs:
      - job: GenerateReport
        displayName: 'Create Simple Report'
        steps:
          - task: PowerShell@2
            displayName: 'Generate Report'
            inputs:
              targetType: 'inline'
              script: |
                $status = if ("$(Build.Result)" -eq "Failed") { "FAILED" } else { "SUCCESS" }
                $report = "SQL Deployment Report`nEnvironment: $(parameters.environment)`nStatus: $status`nDate: $(Get-Date)"
                $report | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/deployment-report.txt"
                Write-Host $report
