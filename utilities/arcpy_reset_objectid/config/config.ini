# Update the default paths and table sections to match your environment before running
# `reset_sde_objectids.py`. Relative paths are resolved from this file's directory.

[DEFAULT]
sde_connection = D:\\Path\\To\\Database.sde
scratch_workspace = D:\\Path\\To\\Scratch.gdb
# Optional: directory where log files will be written
# log_directory = D:\\Path\\To\\Logs

[EXAMPLE_TABLE]
# Fully qualified table or feature class name inside the SDE connection
target_table = DBO.MY_FEATURE_CLASS

# Uncomment and override any values that differ from the defaults above
# sde_connection = ..\\..\\connections\\alternate_database.sde
# scratch_workspace = D:\\AlternateScratch.gdb

