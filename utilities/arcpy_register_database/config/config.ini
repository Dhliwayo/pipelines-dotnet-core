# Configuration file for registering SQL Server databases with ArcGIS Server
# Update the paths to match your existing connection files before running
# `register_arcgis_server_database.py`. Relative paths are resolved from this file's directory.

[DEFAULT]
# Optional: directory where log files will be written
# log_directory = D:\\Path\\To\\Logs

# Database sections - each section represents a database to register
# All paths can be absolute or relative to this config file's directory

[DATABASE_1]
# Path to ArcGIS Server connection file (.ags)
server_conn = C:\\connections\\MYSERVER.ags
# Path to database connection file as seen by the server (.sde)
db_conn_serv = C:\\connections\\Connection_to_wilma.sde
# Path to database connection file as seen by the publisher (.sde) - optional
db_conn_pub = C:\\connections\\Connection_to_pebbles.sde
# Optional: Connection name for the registered database (defaults to section name)
connection_name = WilmaAndPebbles

[DATABASE_2]
server_conn = C:\\connections\\ANOTHERSERVER.ags
db_conn_serv = C:\\connections\\Connection_to_database2.sde
# db_conn_pub is optional - if not provided, db_conn_serv will be used for both server and publisher
# connection_name = AnotherDatabase
